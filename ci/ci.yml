# Конфигурация CI.
#
# Файл лежит здесь, а не в .github/workflows/, потому что публикация
# workflow-файлов требует OAuth-скоуп `workflow`:
#
#     gh auth refresh -h github.com -s workflow
#     mkdir -p .github/workflows && cp ci/ci.yml .github/workflows/ci.yml
#     git add .github/workflows/ci.yml && git commit -m "ci: add workflow" && git push
#
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: vet
        run: go vet ./...

      - name: check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "не отформатировано: $unformatted"
            exit 1
          fi

      - name: test
        run: go test ./...

      - name: build
        run: go build -o cbsg ./cmd/cbsg

      - name: smoke run
        run: |
          ./cbsg -n 50 -seed 1 -quiet | tee /dev/stderr | wc -l

  grammar:
    name: grammar check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install analysis dependencies
        run: python -m pip install --quiet pymorphy3 pyyaml

      - name: build lexicon
        run: python tools/build_lexicon.py

      - name: check grammar of generated text
        run: python tools/check_grammar.py -n 3000 --seed 1
