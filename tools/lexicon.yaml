# Русский корпоративный булшит — источник лексикона.
#
# Секции:
#   nouns        — однословные существительные (род и формы берутся из OpenCorpora)
#   adjectives  — однословные прилагательные (в именительном падеже, м.р.)
#   verbs       — глаголы (вид и формы берутся из OpenCorpora)
#   adverbs     — наречия
#   indeclinable — несклоняемые транслитерации (одна форма на все падежи)
#   phrases     — составные существительные: прилагательное + существительное и т.п.
#   actors      — те, кто действует: подлежащие, для которых строится сказуемое
#   titles      — должности
#   departments — подразделения (всегда в родительном падеже после должности)
#   loans       — леммы, которых нет в словаре: парадигма задана руками
#
# Ключи пишутся через подчёркивание: «рабочая_группа» -> «рабочая группа».

