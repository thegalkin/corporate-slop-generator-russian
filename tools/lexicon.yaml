# Эталоны для ручных лемм: в общий пул не попадают.
templates:
  хороший: good

# Леммы, которых нет в OpenCorpora: парадигма задана руками и проверяется
# round-trip'ом через анализатор.
loans:
  закоммититься:
    en: commit
    forms:
      inf: закоммититься
      ger: закоммитясь
      pres_1sg: закоммичусь
      pres_2sg: закоммитишься
      pres_3sg: закоммитится
      pres_1pl: закоммитимся
      pres_2pl: закоммититесь
      pres_3pl: закоммитятся
      past_m: закоммитился
      past_f: закоммитилась
      past_n: закоммитилось
      past_pl: закоммитились
  капасити:
    en: capacitate
    forms:
      inf: капасити
      ger: капаситя
      pres_1sg: капасичу
      pres_2sg: капаситишь
      pres_3sg: капаситит
      pres_1pl: капаситим
      pres_2pl: капаситите
      pres_3pl: капаситят
      past_m: капаситил
      past_f: капаситила
      past_n: капаситило
      past_pl: капаситили
  # «Бэклог» в словаре есть только в виде падежных форм другого слова —
  # парадигму задаём руками.
  бэклог:
    en: backlog
    kind: noun
    gender: m
    forms:
      nom_sg: бэклог
      gen_sg: бэклога
      dat_sg: бэклогу
      acc_sg: бэклог
      ins_sg: бэклогом
      prep_sg: бэклоге
      nom_pl: бэклоги
      gen_pl: бэклогов
      dat_pl: бэклогам
      acc_pl: бэклоги
      ins_pl: бэклогами
      prep_pl: бэклогах

  # «Форварднуть» — сленговое «переслать дальше», транслитерация глагола.
  форварднуть:
    en: to forward
    forms:
      inf: форварднуть
      ger: форварднув
      pres_1sg: форвардну
      pres_2sg: форварднёшь
      pres_3sg: форварднёт
      pres_1pl: форварднём
      pres_2pl: форварднёте
      pres_3pl: форварднут
      past_m: форварднул
      past_f: форварднула
      past_n: форварднуло
      past_pl: форварднули

  # «Ширший» — значит «быстрее», а не «шире». Парадигма не выдумана:
  # берётся у настоящего прилагательного «синий» и подставляется основа.
  ширший:
    en: faster
    kind: adjective
    template: хороший
    from: хорош
    to: ширш
